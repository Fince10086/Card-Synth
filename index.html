<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Synth</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="workspace-main">
          <div class="signal-flow-shell">
            <section class="signal-flow">
              <div class="add-module-card" id="addModuleCard" tabindex="0" role="button" aria-label="Add module">
                <div class="add-module-icon">+</div>
                <div class="add-module-dropdown" id="addModuleDropdown"></div>
              </div>
            </section>
          </div>
        </main>

      </div>

    <input id="presetFileInput" type="file" accept=".json,application/json" hidden />

    <!-- 底部虚拟键盘容器 -->
    <div id="keyboardContainer" class="keyboard-container">
      <div id="keyboardHandle" class="keyboard-handle" role="button" tabindex="0" aria-label="Toggle keyboard">
        <div class="keyboard-handle-bar"></div>
      </div>
      <div id="keyboardInner" class="keyboard-inner">
        <div id="bottomKeyboard" class="bottom-keyboard" aria-hidden="true">
          <div id="keyboardContent" class="keyboard-content"></div>
        </div>
        <button id="octaveDownBtn" class="octave-float-btn octave-float-btn--left" type="button" aria-label="Lower octave" data-delta="-1">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="octaveUpBtn" class="octave-float-btn octave-float-btn--right" type="button" aria-label="Raise octave" data-delta="1">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
